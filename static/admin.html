<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GORE admin</title>
<link rel="stylesheet" href="/style.css">
<style>
#app{max-width:1100px}
.row{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0;font-size:12px}
.row img{width:110px;height:62px;object-fit:cover;background:#000;border:1px solid var(--line)}
.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dim{color:var(--dim)}
</style>
</head>
<body>
<header><a href="#/" id="logo">GORE<span class="logo-dot">.</span></a>
<span class="dim">admin</span>
<input id="tok" placeholder="admin token" type="password" style="background:var(--panel);border:1px solid var(--line);padding:6px 10px;margin-left:auto">
<button class="btn sm" id="load">LOAD</button></header>
<div id="tagbar"><span class="tag on" data-v="reports">reports</span><span class="tag" data-v="active">active</span><span class="tag" data-v="removed">removed</span></div>
<main id="app"></main>
<script src="/admin.js"></script>
</body>
</html>
