<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>gore admin</title>
<link rel="stylesheet" href="/style.v3.css">
<style>
#app{max-width:1100px}
.row{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0;font-size:12.5px;background:#fff}
.row img{width:110px;height:62px;object-fit:cover;background:#000;border:1px solid var(--line)}
.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adminbar{display:flex;gap:8px;align-items:center;padding:10px 0}
#tok{border:1px solid #cfcfcf;border-radius:3px;padding:6px 10px}
.tagbar{display:flex;gap:6px;padding:8px 0}
</style>
</head>
<body>
<header class="masthead"><div class="container">
  <a class="logo" href="/">gore</a>
  <span class="dim" style="margin-left:12px">admin</span>
</div></header>
<nav class="navbar"><div class="container">
  <a class="navlink" href="/">HOME</a>
  <div class="navright">
    <input id="tok" placeholder="admin token" type="password">
    <button class="btn-reg" id="load">LOAD</button>
  </div>
</div></nav>
<div class="container">
  <h1 class="pagetitle">Moderation</h1>
  <div class="tagbar"><span class="tag on" data-v="reports">reports</span><span class="tag" data-v="active">active</span><span class="tag" data-v="removed">removed</span></div>
  <main id="app" class="main" style="flex:none"></main>
</div>
<script src="/admin.v3.js"></script>
</body>
</html>
